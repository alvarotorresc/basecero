<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0c0e; font-family: 'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif; color: #e7e9ec; -webkit-font-smoothing: antialiased; }
    a { color: #2f6bff; text-decoration: none; }
    a:hover { color: #6b95ff; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0b0c0e; padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 12px;">

  <!-- cabecera -->
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.01em;">Nuevo gasto</div>
      <div style="font-size: 11px; font-weight: 600; color: #9aa1a9; background: #151719; border: 1px solid #23272b; border-radius: 8px; padding: 4px 8px;">Agosto 2026</div>
    </div>
    <div style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 1px solid #23272b; border-radius: 12px; background: #151719;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9aa1a9" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path></svg>
    </div>
  </div>

  <!-- importe -->
  <div style="display: flex; flex-direction: column; gap: 4px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <div style="font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: #656c74;">IMPORTE</div>
      <div style="font-size: 11px; color: #9aa1a9;">Hoy · 24 ago</div>
    </div>
    <div style="display: flex; align-items: baseline; gap: 8px; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; line-height: 1;">
      <div style="font-size: 58px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;">45,00</div>
      <div style="font-size: 28px; font-weight: 500; color: #656c74;">€</div>
    </div>
    <div style="height: 1px; background: #23272b; margin-top: 8px;"></div>
  </div>

  <!-- categorías frecuentes -->
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <div style="font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: #656c74;">CATEGORÍA</div>
      <div style="font-size: 12px; font-weight: 600; color: #2f6bff;">Ver todas</div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">

      <div style="height: 44px; display: flex; align-items: center; gap: 9px; padding: 0 14px 0 8px; border-radius: 15px; background: #2f6bff;">
        <div style="width: 30px; height: 30px; border-radius: 10px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v6a2.6 2.6 0 005.2 0V3"></path><path d="M8.6 11.6V21"></path><path d="M18.4 3c-1.6 1.4-2.4 3.2-2.4 5.4 0 1.8.8 2.8 2.4 3V21"></path></svg>
        </div>
        <div style="font-size: 14px; font-weight: 600; color: #ffffff;">Restaurantes</div>
      </div>

      <div style="height: 44px; display: flex; align-items: center; gap: 9px; padding: 0 14px 0 8px; border-radius: 15px; background: #151719; border: 1px solid #23272b;">
        <div style="width: 30px; height: 30px; border-radius: 10px; background: #16261c; display: flex; align-items: center; justify-content: center;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#58d68d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5h2.2l2.3 10.2a1.8 1.8 0 001.8 1.4h7.4a1.8 1.8 0 001.8-1.4L20 8H6"></path><circle cx="9.5" cy="19.5" r="1.2"></circle><circle cx="16.5" cy="19.5" r="1.2"></circle></svg>
        </div>
        <div style="font-size: 14px; font-weight: 500; color: #c8ccd1;">Supermercado</div>
      </div>

      <div style="height: 44px; display: flex; align-items: center; gap: 9px; padding: 0 14px 0 8px; border-radius: 15px; background: #151719; border: 1px solid #23272b;">
        <div style="width: 30px; height: 30px; border-radius: 10px; background: #2a2016; display: flex; align-items: center; justify-content: center;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#f0a868" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5v5.2a3.2 3.2 0 006.4 0V3.5"></path><path d="M11.2 12v8.5"></path><path d="M5 20.5h12.5"></path></svg>
        </div>
        <div style="font-size: 14px; font-weight: 500; color: #c8ccd1;">Bares y cafés</div>
      </div>

      <div style="height: 44px; display: flex; align-items: center; gap: 9px; padding: 0 14px 0 8px; border-radius: 15px; background: #151719; border: 1px solid #23272b;">
        <div style="width: 30px; height: 30px; border-radius: 10px; background: #14252a; display: flex; align-items: center; justify-content: center;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#56c6de" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 16.2h15.6v-3.8l-1.7-4.1a1.6 1.6 0 00-1.5-1H7.4a1.6 1.6 0 00-1.5 1l-1.7 4.1z"></path><path d="M6 16.2v2.4h2.6v-2.4M15.4 16.2v2.4H18v-2.4"></path></svg>
        </div>
        <div style="font-size: 14px; font-weight: 500; color: #c8ccd1;">Gasolina</div>
      </div>

      <div style="height: 44px; display: flex; align-items: center; gap: 9px; padding: 0 14px 0 8px; border-radius: 15px; background: #151719; border: 1px solid #23272b;">
        <div style="width: 30px; height: 30px; border-radius: 10px; background: #2a1c1c; display: flex; align-items: center; justify-content: center;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ec8a84" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.2-4.5-7.2-9.4A3.9 3.9 0 0112 8.4a3.9 3.9 0 017.2 2.2C19.2 15.5 12 20 12 20z"></path></svg>
        </div>
        <div style="font-size: 14px; font-weight: 500; color: #c8ccd1;">Farmacia</div>
      </div>

    </div>
  </div>

  <!-- cuenta -->
  <div style="height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #151719; border: 1px solid #23272b; border-radius: 18px;">
    <div style="font-size: 13px; color: #9aa1a9;">Cuenta</div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="font-size: 15px; font-weight: 600;">N26</div>
      <div style="font-size: 11px; color: #656c74;">corriente</div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#656c74" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5l7 7-7 7"></path></svg>
    </div>
  </div>

  <!-- compartido con Sara -->
  <div style="background: #151719; border: 1px solid #23272b; border-radius: 20px; padding: 10px 16px 0; display: flex; flex-direction: column;">
    <div style="height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <div style="font-size: 15px; font-weight: 600;">Compartido con Sara</div>
      <div style="width: 48px; height: 28px; border-radius: 14px; background: {{trackBg}}; display: flex; align-items: center; padding: 3px; flex-shrink: 0;">
        <div style="width: 22px; height: 22px; border-radius: 11px; background: #ffffff; margin-left: {{knobShift}};"></div>
      </div>
    </div>
    <sc-if value="{{compartido}}" hint-placeholder-val="{{ true }}">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 2px 0 12px;">
        <div style="background: #1b1e21; border-radius: 14px; padding: 10px 11px; display: flex; flex-direction: column; gap: 3px;">
          <div style="font-size: 10px; color: #656c74;">Tu parte · 60 %</div>
          <div style="font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;">27,00 €</div>
        </div>
        <div style="background: #1b1e21; border-radius: 14px; padding: 10px 11px; display: flex; flex-direction: column; gap: 3px;">
          <div style="font-size: 10px; color: #656c74;">Sara · 40 %</div>
          <div style="font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 600; color: #9aa1a9; font-variant-numeric: tabular-nums;">18,00 €</div>
        </div>
        <div style="background: #1b1e21; border-radius: 14px; padding: 10px 11px; display: flex; flex-direction: column; gap: 3px;">
          <div style="font-size: 10px; color: #656c74;">Te debe ya</div>
          <div style="font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 600; color: #f87171; font-variant-numeric: tabular-nums;">42,50 €</div>
        </div>
      </div>
    </sc-if>
  </div>

  <!-- teclado -->
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
    <div style="height: 44px; background: #151719; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 22px; font-weight: 500;">1</div>
    <div style="height: 44px; background: #151719; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 22px; font-weight: 500;">2</div>
    <div style="height: 44px; background: #151719; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 22px; font-weight: 500;">3</div>
    <div style="height: 44px; background: #151719; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 22px; font-weight: 500;">4</div>
    <div style="height: 44px; background: #151719; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 22px; font-weight: 500;">5</div>
    <div style="height: 44px; background: #151719; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 22px; font-weight: 500;">6</div>
    <div style="height: 44px; background: #151719; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 22px; font-weight: 500;">7</div>
    <div style="height: 44px; background: #151719; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 22px; font-weight: 500;">8</div>
    <div style="height: 44px; background: #151719; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 22px; font-weight: 500;">9</div>
    <div style="height: 44px; background: #151719; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 22px; font-weight: 500; color: #9aa1a9;">,</div>
    <div style="height: 44px; background: #151719; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 22px; font-weight: 500;">0</div>
    <div style="height: 44px; background: #151719; border-radius: 14px; display: flex; align-items: center; justify-content: center;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9aa1a9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5.5H9.2L3.5 12l5.7 6.5H20a1 1 0 001-1v-11a1 1 0 00-1-1z"></path><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"></path></svg>
    </div>
  </div>

  <!-- guardar -->
  <div style="margin-top: auto; height: 58px; background: #2f6bff; border-radius: 20px; display: flex; align-items: center; justify-content: center; gap: 10px;">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"></path></svg>
    <div style="font-size: 16px; font-weight: 700; color: #ffffff;">Guardar gasto</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"compartido":{"editor":"boolean","default":true,"section":"Estado"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const compartido = this.props.compartido ?? true;
    return {
      compartido: compartido,
      trackBg: compartido ? '#2f6bff' : '#2a2f34',
      knobShift: compartido ? '20px' : '0px'
    };
  }
}
</script>
</body>
</html>
