<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f1ec; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif; color: #1d1a15; -webkit-font-smoothing: antialiased; }
    a { color: #af5331; text-decoration: none; }
    a:hover { color: #7d3317; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #f4f1ec; padding: 18px 20px 18px; display: flex; flex-direction: column; gap: 14px;">

  <!-- cabecera -->
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em;">Nuevo gasto</div>
      <div style="font-size: 11px; font-weight: 500; color: #6f6b64; background: #efebe2; border-radius: 6px; padding: 4px 8px;">Agosto 2026</div>
    </div>
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border: 1px solid #dedad3; border-radius: 10px; background: #fcfaf6;">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#1d1a15" stroke-width="1.5" stroke-linecap="round"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"></path></svg>
    </div>
  </div>

  <!-- importe: el número es el protagonista -->
  <div style="display: flex; flex-direction: column; gap: 4px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.12em; color: #86817a;">IMPORTE</div>
      <div style="font-size: 11px; color: #6f6b64;">Hoy · 24 ago</div>
    </div>
    <div style="display: flex; align-items: baseline; gap: 8px; font-family: 'Instrument Serif', 'Times New Roman', Times, serif; line-height: 1;">
      <div style="font-size: 66px; color: #1d1a15; letter-spacing: -0.01em;">45,00</div>
      <div style="font-size: 30px; color: #6f6b64;">€</div>
    </div>
    <div style="height: 2px; background: #1d1a15; margin-top: 4px;"></div>
  </div>

  <!-- categorías frecuentes -->
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.12em; color: #86817a;">CATEGORÍA</div>
      <div style="font-size: 11px; color: #6f6b64;">Ver todas →</div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
      <div style="height: 44px; display: flex; align-items: center; padding: 0 15px; border-radius: 10px; background: #1d1a15; color: #f7f4ee; font-size: 14px; font-weight: 500;">Restaurantes</div>
      <div style="height: 44px; display: flex; align-items: center; padding: 0 15px; border-radius: 10px; background: #fcfaf6; border: 1px solid #dedad3; font-size: 14px; font-weight: 500;">Supermercado</div>
      <div style="height: 44px; display: flex; align-items: center; padding: 0 15px; border-radius: 10px; background: #fcfaf6; border: 1px solid #dedad3; font-size: 14px; font-weight: 500;">Bares y cafés</div>
      <div style="height: 44px; display: flex; align-items: center; padding: 0 15px; border-radius: 10px; background: #fcfaf6; border: 1px solid #dedad3; font-size: 14px; font-weight: 500;">Gasolina</div>
      <div style="height: 44px; display: flex; align-items: center; padding: 0 15px; border-radius: 10px; background: #fcfaf6; border: 1px solid #dedad3; font-size: 14px; font-weight: 500;">Comida a domicilio</div>
      <div style="height: 44px; display: flex; align-items: center; padding: 0 15px; border-radius: 10px; background: #fcfaf6; border: 1px solid #dedad3; font-size: 14px; font-weight: 500;">Farmacia</div>
    </div>
  </div>

  <!-- cuenta + compartido -->
  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; background: #fcfaf6; border: 1px solid #dedad3; border-radius: 12px;">
      <div style="font-size: 13px; color: #6f6b64;">Cuenta</div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="font-size: 15px; font-weight: 600;">N26</div>
        <div style="font-size: 11px; color: #6f6b64;">corriente</div>
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#86817a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4l6 6-6 6"></path></svg>
      </div>
    </div>

    <div style="background: #fcfaf6; border: 1px solid #dedad3; border-radius: 12px; padding: 11px 14px 0; display: flex; flex-direction: column;">
      <div style="height: 38px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <div style="font-size: 15px; font-weight: 500;">Compartido con Sara</div>
        <div style="width: 46px; height: 26px; border-radius: 13px; background: {{trackBg}}; display: flex; align-items: center; padding: 3px;">
          <div style="width: 20px; height: 20px; border-radius: 10px; background: #fcfaf6; margin-left: {{knobShift}};"></div>
        </div>
      </div>
      <sc-if value="{{compartido}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 9px; padding-bottom: 11px;">
          <div style="height: 1px; background: #dedad3;"></div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
            <div style="display: flex; flex-direction: column; gap: 3px;">
              <div style="font-size: 10px; letter-spacing: 0.06em; color: #86817a;">TU PARTE · 60 %</div>
              <div style="font-size: 15px; font-weight: 600;">27,00 €</div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 3px;">
              <div style="font-size: 10px; letter-spacing: 0.06em; color: #86817a;">SARA · 40 %</div>
              <div style="font-size: 15px; font-weight: 600; color: #6f6b64;">18,00 €</div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 3px;">
              <div style="font-size: 10px; letter-spacing: 0.06em; color: #86817a;">TE DEBE YA</div>
              <div style="font-size: 15px; font-weight: 600; color: #af5331;">286,40 €</div>
            </div>
          </div>
        </div>
      </sc-if>
    </div>
  </div>

  <!-- teclado numérico: rejilla de finas líneas, como un libro de cuentas -->
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: #dedad3; padding: 1px; border-radius: 12px; overflow: hidden;">
    <div style="height: 48px; background: #f4f1ec; display: flex; align-items: center; justify-content: center; font-size: 23px; font-weight: 500;">1</div>
    <div style="height: 48px; background: #f4f1ec; display: flex; align-items: center; justify-content: center; font-size: 23px; font-weight: 500;">2</div>
    <div style="height: 48px; background: #f4f1ec; display: flex; align-items: center; justify-content: center; font-size: 23px; font-weight: 500;">3</div>
    <div style="height: 48px; background: #f4f1ec; display: flex; align-items: center; justify-content: center; font-size: 23px; font-weight: 500;">4</div>
    <div style="height: 48px; background: #f4f1ec; display: flex; align-items: center; justify-content: center; font-size: 23px; font-weight: 500;">5</div>
    <div style="height: 48px; background: #f4f1ec; display: flex; align-items: center; justify-content: center; font-size: 23px; font-weight: 500;">6</div>
    <div style="height: 48px; background: #f4f1ec; display: flex; align-items: center; justify-content: center; font-size: 23px; font-weight: 500;">7</div>
    <div style="height: 48px; background: #f4f1ec; display: flex; align-items: center; justify-content: center; font-size: 23px; font-weight: 500;">8</div>
    <div style="height: 48px; background: #f4f1ec; display: flex; align-items: center; justify-content: center; font-size: 23px; font-weight: 500;">9</div>
    <div style="height: 48px; background: #f4f1ec; display: flex; align-items: center; justify-content: center; font-size: 23px; font-weight: 500; color: #6f6b64;">,</div>
    <div style="height: 48px; background: #f4f1ec; display: flex; align-items: center; justify-content: center; font-size: 23px; font-weight: 500;">0</div>
    <div style="height: 48px; background: #f4f1ec; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6f6b64" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5.5H9.2L3.5 12l5.7 6.5H20a1 1 0 001-1v-11a1 1 0 00-1-1z"></path><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"></path></svg>
    </div>
  </div>

  <!-- guardar -->
  <div style="height: 56px; background: #1d1a15; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 10px;">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="#f7f4ee" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"></path></svg>
    <div style="font-size: 16px; font-weight: 600; color: #f7f4ee;">Guardar gasto</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"compartido":{"editor":"boolean","default":true,"section":"Estado"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const compartido = this.props.compartido ?? true;
    return {
      compartido: compartido,
      trackBg: compartido ? '#1d1a15' : '#cbc7bd',
      knobShift: compartido ? '20px' : '0px'
    };
  }
}
</script>
</body>
</html>
