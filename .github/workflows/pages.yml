name: pages
# Este workflow NO publica la app. El sitio de verdad (basecero.alvarotc.com, servido por Vercel)
# es el único que la sirve: aquí se publicaba una copia de app/ que ni siquiera funcionaba —las
# rutas absolutas del index y del manifest apuntan a la raíz del dominio, no a /basecero/—, así que
# el espejo era una versión rota e indexable de lo mismo. Se queda solo una redirección
# (pages-redirect/) que conserva la ruta, la query y el hash.
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: pages-redirect }
      - id: deployment
        uses: actions/deploy-pages@v4
