<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BaseCero se ha mudado</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://basecero.alvarotc.com/">
<!-- Respaldo sin JavaScript. A 2 s y no a 0 a propósito: quien reconstruye la ruta completa es el
     script de abajo, y un refresh inmediato podría adelantarse y dejar a todo el mundo en la
     portada, perdiendo /app/. Con JS el salto ocurre en milisegundos y este meta nunca actúa. -->
<meta http-equiv="refresh" content="2; url=https://basecero.alvarotc.com/">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #121214; color: #F0EFF4; font-family: system-ui, sans-serif; padding: 24px;
  }
  main { max-width: 34rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
  p { margin: 0 0 1rem; color: #9A99A6; line-height: 1.6; }
  a { color: #4FD99A; }
</style>
</head>
<body>
<main>
  <h1>BaseCero se ha mudado</h1>
  <p>Esta dirección ya no sirve la aplicación. La buena es
    <a id="destino" href="https://basecero.alvarotc.com/">basecero.alvarotc.com</a>.</p>
  <p>Si no te lleva sola, toca el enlace.</p>
</main>
<script>
  // Conserva ruta, query y hash, quitando el prefijo /basecero del espejo:
  //   /basecero/app/?x=1#y  ->  https://basecero.alvarotc.com/app/?x=1#y
  // location.replace y no location.href: así el atrás del navegador no vuelve aquí y entra en bucle.
  (function () {
    var DEST = "https://basecero.alvarotc.com";
    var path = window.location.pathname.replace(/^\/basecero(?=\/|$)/, "");
    var url = DEST + (path || "/") + window.location.search + window.location.hash;
    var enlace = document.getElementById("destino");
    if (enlace) enlace.href = url;
    window.location.replace(url);
  })();
</script>
</body>
</html>
