<meta name="theme-color" content="#E3E1DC">
<meta name="color-scheme" content="light dark">
<script>
/* Tema sin destello (DESIGN.md §3): corre antes de cualquier CSS. Duplica readPref/resolveTheme de
   js/theme.js (aquí no hay módulos); index-theme.test.mjs evalúa las dos copias con la misma tabla.
   El hex es el --bg oscuro de tokens.css; main.js lo vuelve a leer del CSS al arrancar. */
(function () {
  var pref = "system";
  try {
    var v = window.localStorage.getItem("bc-theme");
    if (v === "light" || v === "dark" || v === "system") pref = v;
  } catch (e) {}
  var dark = pref === "dark";
  if (pref === "system") {
    try { dark = window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
  }
  if (dark) {
    document.documentElement.setAttribute("data-theme", "dark");
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", "#161719");
  }
})();
</script>
